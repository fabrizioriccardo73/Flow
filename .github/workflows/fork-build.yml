name: Fork build (FOSS)

# Builds the fork's FOSS release APK, signed with the fork's own key.
# The upstream workflows (build.yml, codeql.yml, labeler.yml) are disabled in this fork
# from the Actions settings rather than edited, so upstream merges stay conflict-free.
# See FORK.md for the required secrets.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and FOSS release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run FOSS unit tests
        run: ./gradlew :app:testFossDebugUnitTest --build-cache --stacktrace

      # app/build.gradle.kts signs release builds with rootDir/release.keystore when it exists,
      # reading the passwords from STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
      - name: Restore the fork's signing key
        env:
          FORK_KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FORK_KEYSTORE_BASE64" ]; then
            echo "::error::Secret FORK_KEYSTORE_BASE64 is missing: see FORK.md"
            exit 1
          fi
          echo "$FORK_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build FOSS release APK
        env:
          STORE_PASSWORD: ${{ secrets.FORK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFossRelease --build-cache --stacktrace

      - name: Print signer certificate
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/foss/release/app-foss-universal-release.apk | grep -E "SHA-256|SHA-1"

      - name: Remove signing key
        if: always()
        run: rm -f release.keystore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: flow-yt-foss-release-${{ github.sha }}
          path: app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
